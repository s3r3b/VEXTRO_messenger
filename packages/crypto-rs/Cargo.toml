[package]
name = "vextro-crypto-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
sodiumoxide = "0.2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
